<svg width="1000" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Anthropic-inspired gradient: warm coral to cream -->
    <linearGradient id="anthropicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1"/>
    </linearGradient>

    <!-- Accent gradient with Anthropic's signature coral -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6f3f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff8c5f;stop-opacity:1"/>
    </linearGradient>

    <!-- Subtle glow for text -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Geometric pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#ff6f3f" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="url(#anthropicBg)"/>

  <!-- Subtle grid pattern -->
  <rect width="1000" height="200" fill="url(#grid)"/>

  <!-- Minimal geometric accent lines -->
  <g opacity="0.15">
    <line x1="0" y1="100" x2="1000" y2="100" stroke="#ff6f3f" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating minimal geometric shapes -->
  <g opacity="0.3">
    <rect x="100" y="40" width="2" height="2" fill="#ff6f3f">
      <animate attributeName="y" values="40;45;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="850" y="150" width="2" height="2" fill="#ff8c5f">
      <animate attributeName="y" values="150;145;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="160" r="1.5" fill="#ff6f3f">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="50" r="1.5" fill="#ff8c5f">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Accent bar with gradient -->
  <rect x="80" y="75" width="4" height="50" fill="url(#coralAccent)" rx="2">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Main title - clean, professional -->
  <text x="110" y="90" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="28" font-weight="400" fill="#e8e8e8" letter-spacing="0.5">
    Awesome Claude Code
  </text>

  <!-- "OUTPUT STYLES" - prominent with Anthropic coral -->
  <text x="110" y="125" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="48" font-weight="700" fill="url(#coralAccent)" filter="url(#textGlow)" letter-spacing="1">
    OUTPUT STYLES
    <animate attributeName="opacity" values="0.95;1;0.95" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline - subtle and refined -->
  <text x="110" y="155" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="16" font-weight="300" fill="#b8b8b8" letter-spacing="0.5">
    (That I Really Like)
    <animate attributeName="opacity" values="0.7;0.85;0.7" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Minimal decorative brackets - code aesthetic -->
  <g transform="translate(920, 95)" opacity="0.4">
    <path d="M 0 0 L 4 0 L 4 20 L 0 20" stroke="#ff6f3f" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 12 0 L 8 0 L 8 20 L 12 20" stroke="#ff6f3f" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Minimal cursor blink -->
  <rect x="905" y="108" width="2" height="18" fill="#ff6f3f">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent line -->
  <line x1="110" y1="170" x2="350" y2="170" stroke="#ff6f3f" stroke-width="1.5" opacity="0.3">
    <animate attributeName="x2" values="350;370;350" dur="5s" repeatCount="indefinite"/>
  </line>
</svg>
