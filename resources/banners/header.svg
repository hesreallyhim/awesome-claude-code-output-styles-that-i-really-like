<svg width="1000" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Slow-moving gradient background -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1">
        <animate attributeName="stop-color" values="#0a0e14;#0d1117;#0a0e14" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1">
        <animate attributeName="stop-color" values="#161b22;#1c2128;#161b22" dur="18s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanline effect -->
    <pattern id="scanlines" x="0" y="0" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="#000000" opacity="0.05"/>
      <rect y="2" width="100%" height="2" fill="transparent"/>
    </pattern>

    <!-- Terminal glow -->
    <filter id="terminalGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with slow-moving gradient -->
  <rect width="1000" height="200" fill="url(#terminalBg)"/>

  <!-- Scanline overlay -->
  <rect width="1000" height="200" fill="url(#scanlines)"/>

  <!-- Border frame - terminal window style -->
  <rect x="10" y="10" width="980" height="180" fill="none" stroke="#ff6f3f" stroke-width="2" opacity="0.3" rx="4"/>

  <!-- Top terminal bar -->
  <rect x="10" y="10" width="980" height="30" fill="#000000" opacity="0.4" rx="4"/>
  <circle cx="25" cy="25" r="5" fill="#ff5f56" opacity="0.6"/>
  <circle cx="45" cy="25" r="5" fill="#ffbd2e" opacity="0.6"/>
  <circle cx="65" cy="25" r="5" fill="#27c93f" opacity="0.6"/>
  <text x="85" y="30" font-family="'Courier New', 'Courier', monospace" font-size="12" fill="#666666" opacity="0.8">
    awesome-claude-code-output-styles
  </text>

  <!-- Command prompt indicator -->
  <text x="40" y="80" font-family="'Courier New', 'Courier', 'Monaco', monospace" font-size="18" fill="#ff6f3f" filter="url(#terminalGlow)">
    $
  </text>

  <!-- Main title line -->
  <text x="65" y="80" font-family="'Courier New', 'Courier', 'Monaco', monospace" font-size="24" fill="#ff6f3f" filter="url(#terminalGlow)">
    awesome_claude_code_
  </text>

  <!-- "OUTPUT STYLES" - Anthropic burnt orange -->
  <text x="40" y="125" font-family="'Courier New', 'Courier', 'Monaco', monospace" font-size="42" font-weight="bold" fill="#ff6f3f" filter="url(#terminalGlow)" letter-spacing="2">
    OUTPUT STYLES
  </text>

  <!-- Tagline with comment style -->
  <text x="40" y="160" font-family="'Courier New', 'Courier', 'Monaco', monospace" font-size="16" fill="#999999">
    # (That I Really Like)
  </text>

  <!-- Blinking cursor -->
  <rect x="710" y="100" width="12" height="28" fill="#ff6f3f" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom status line - retro terminal style -->
  <text x="40" y="178" font-family="'Courier New', 'Courier', 'Monaco', monospace" font-size="11" fill="#666666" opacity="0.7">
    [6 styles loaded] [SMIL animations: ON] [Press any key to continue...]
  </text>

  <!-- Subtle corner brackets -->
  <path d="M 30 55 L 30 50 L 35 50" stroke="#ff6f3f" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 970 55 L 970 50 L 965 50" stroke="#ff6f3f" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 30 165 L 30 170 L 35 170" stroke="#ff6f3f" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 970 165 L 970 170 L 965 170" stroke="#ff6f3f" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
