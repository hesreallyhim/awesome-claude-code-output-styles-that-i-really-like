<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1"/>
    </linearGradient>

    <filter id="techGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#techGrad)" rx="8"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="30" x2="800" y2="30" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#ffffff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="120" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Animated circuit elements -->
  <circle cx="50" cy="40" r="4" fill="none" stroke="#60a5fa" stroke-width="2">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="50" y1="44" x2="50" y2="76" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
  <circle cx="50" cy="80" r="3" fill="#60a5fa" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated data stream -->
  <rect x="720" y="20" width="60" height="3" fill="#93c5fd" opacity="0.6">
    <animate attributeName="x" values="800;650" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="720" y="50" width="40" height="3" fill="#93c5fd" opacity="0.6">
    <animate attributeName="x" values="800;650" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="720" y="80" width="50" height="3" fill="#93c5fd" opacity="0.6">
    <animate attributeName="x" values="800;650" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Icon: code brackets -->
  <g transform="translate(120, 35)" filter="url(#techGlow)">
    <path d="M 0 20 L 8 10 L 0 0" stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 25 0 L 33 10 L 25 20" stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main text -->
  <text x="170" y="55" font-family="'SF Mono', 'Monaco', monospace" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#techGlow)">
    CLAUDE CODE
  </text>
  <text x="170" y="85" font-family="'SF Mono', 'Monaco', monospace" font-size="24" font-weight="600" fill="#93c5fd">
    Technical Evangelist
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Status indicator -->
  <circle cx="760" cy="100" r="5" fill="#10b981">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
