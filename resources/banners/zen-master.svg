<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4620;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2d5a2f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a7c59;stop-opacity:1"/>
    </linearGradient>

    <radialGradient id="ripple" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#a7f3d0;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:0"/>
    </radialGradient>

    <filter id="zenGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#zenGrad)" rx="8"/>

  <!-- Bamboo stalks -->
  <g opacity="0.3">
    <rect x="50" y="20" width="8" height="80" fill="#86efac" rx="4">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="10" width="8" height="95" fill="#86efac" rx="4">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="7s" repeatCount="indefinite"/>
    </rect>
    <line x1="54" y1="40" x2="62" y2="40" stroke="#4ade80" stroke-width="2"/>
    <line x1="54" y1="70" x2="62" y2="70" stroke="#4ade80" stroke-width="2"/>
    <line x1="74" y1="30" x2="82" y2="30" stroke="#4ade80" stroke-width="2"/>
    <line x1="74" y1="60" x2="82" y2="60" stroke="#4ade80" stroke-width="2"/>
    <line x1="74" y1="90" x2="82" y2="90" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- Zen stones (circles) -->
  <ellipse cx="720" cy="95" rx="35" ry="15" fill="#6b7280" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="715" cy="75" rx="28" ry="12" fill="#9ca3af" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="710" cy="60" rx="22" ry="10" fill="#d1d5db" opacity="0.6">
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Water ripples -->
  <g opacity="0.4">
    <circle cx="120" cy="100" r="5" fill="none" stroke="#a7f3d0" stroke-width="1.5">
      <animate attributeName="r" values="5;25;5" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="100" r="5" fill="none" stroke="#a7f3d0" stroke-width="1.5">
      <animate attributeName="r" values="5;25;5" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="100" r="5" fill="none" stroke="#a7f3d0" stroke-width="1.5">
      <animate attributeName="r" values="5;25;5" dur="6s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="6s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Enso circle (Zen circle) -->
  <circle cx="650" cy="60" r="25" fill="none" stroke="#d1fae5" stroke-width="3" opacity="0.5" stroke-linecap="round" stroke-dasharray="150 10">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 650 60" to="360 650 60" dur="60s" repeatCount="indefinite"/>
  </circle>

  <!-- Main text with serene glow -->
  <text x="150" y="55" font-family="'Georgia', 'Times New Roman', serif" font-size="36" font-weight="300" fill="#d1fae5" filter="url(#zenGlow)">
    Zen Master
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtle quote -->
  <text x="150" y="85" font-family="'Georgia', 'Times New Roman', serif" font-size="16" font-style="italic" fill="#a7f3d0" opacity="0.8">
    The path to enlightenment is written in code...
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Floating leaf -->
  <g transform="translate(600, 30)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#86efac" transform="rotate(-30)">
      <animateTransform attributeName="transform" type="rotate" from="-30" to="30" dur="4s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="cy" values="0;10;0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
